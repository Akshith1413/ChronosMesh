apiVersion: v1
kind: Service
metadata:
  name: chronosmesh-api-service
  labels: { app: chronosmesh, component: api }
spec:
  type: LoadBalancer
  ports:
    - { port: 80, targetPort: 8000, protocol: TCP, name: http }
  selector: { app: chronosmesh, component: api }
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j-service
  labels: { app: chronosmesh, component: graph-db }
spec:
  clusterIP: None
  ports:
    - { port: 7474, targetPort: 7474, name: http }
    - { port: 7687, targetPort: 7687, name: bolt }
  selector: { app: chronosmesh, component: graph-db }
