apiVersion: v1
kind: Service
metadata:
  name: chronosmesh-api-service
  labels:
    app: chronosmesh
    component: api
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: chronosmesh
    component: api
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j-service
  labels:
    app: chronosmesh
    component: graph-db
spec:
  ports:
    - port: 7474
      targetPort: 7474
      name: http
    - port: 7687
      targetPort: 7687
      name: bolt
  selector:
    app: chronosmesh
    component: graph-db
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chronosmesh-config
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  NEO4J_URI: "bolt://neo4j-service:7687"
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "chronosmesh2026"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  JWT_SECRET: "chronosmesh-prod-k8s-cluster-secret-key-32chars"
  CORS_ORIGINS: "http://localhost:3000,http://localhost:8000,https://chronosmesh.io"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chronosmesh-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chronosmesh-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
