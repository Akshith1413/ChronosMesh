apiVersion: 1
datasources:
  # In AWS, Grafana reads CloudWatch with the task role (authType "default"); no Prometheus is deployed.
  - name: CloudWatch
    uid: cloudwatch
    type: cloudwatch
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      authType: default
      defaultRegion: ${AWS_REGION:-ap-south-2}
