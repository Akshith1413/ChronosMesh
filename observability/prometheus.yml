global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  # API: /metrics (set METRICS_TOKEN on the API and mount the same token at /etc/prometheus/metrics_token to require it)
  - job_name: "chronosmesh-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["chronosmesh-api:8000"]
        labels:
          service: "chronosmesh-api"
          environment: "local"

  # Queue worker: reconstruction latency, duplicates, unresolved dependencies, queue age, heartbeat
  - job_name: "chronosmesh-worker"
    static_configs:
      - targets: ["chronosmesh-worker:9100"]
        labels:
          service: "chronosmesh-worker"
          environment: "local"

  # OpenTelemetry Collector's own metrics + span-derived metrics
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
