# AWS (ADOT) collector sidecar for the ECS API task: OTLP in -> AWS X-Ray traces + CloudWatch EMF metrics.
# The task role needs xray:PutTraceSegments / xray:PutTelemetryRecords and cloudwatch:PutMetricData.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s
  resource:
    attributes:
      - key: service.namespace
        value: chronosmesh
        action: upsert

exporters:
  awsxray:
    index_all_attributes: false
  awsemf:
    namespace: ChronosMesh/Traces
    log_group_name: /chronosmesh/otel-metrics

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [awsxray]
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [awsemf]
