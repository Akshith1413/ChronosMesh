name: Docker CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, worker, grafana]
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config -q

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/Dockerfile
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: chronosmesh/${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: chronosmesh/${{ matrix.target }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Smoke test the API image
        if: matrix.target == 'api'
        run: |
          docker run -d --name api -p 8000:8000 -e ENABLE_DEMO_USERS=true chronosmesh/api:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/api/health && break || sleep 2; done
          curl -fsS http://localhost:8000/api/health/ready
          curl -fsS http://localhost:8000/ | grep -qi "chronosmesh"
