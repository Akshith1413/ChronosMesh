# ChronosMesh local stack.
#
#   docker compose up --build                 API + worker + local AWS (moto) + OpenTelemetry + Prometheus + Grafana
#   docker compose --profile full up --build  ... plus Kafka, Neo4j and Flink (the optional streaming/graph stack)
#
# UI/API: http://localhost:8000   Grafana: http://localhost:3000   Prometheus: http://localhost:9090
# Everything is bound to 127.0.0.1. Nothing here is production configuration.

x-aws-local: &aws-local
  AWS_REGION: ap-south-2
  AWS_DEFAULT_REGION: ap-south-2
  AWS_ENDPOINT_URL: http://aws-local:5000
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  STORAGE_BACKEND: aws
  DYNAMODB_EXEC_TABLE: chronosmesh-executions
  DYNAMODB_EVENTS_TABLE: chronosmesh-events
  DYNAMODB_ANOMALY_TABLE: chronosmesh-anomalies
  DYNAMODB_GRAPH_TABLE: chronosmesh-causal-graphs
  S3_DATA_BUCKET: chronosmesh-data-local
  SQS_EVENTS_QUEUE_URL: http://aws-local:5000/000000000000/chronosmesh-events
  INGEST_MODE: queue

services:
  # ── Local AWS emulator (DynamoDB, S3, SQS, CloudWatch) ───────────────────────
  aws-local:
    image: motoserver/moto:5.0.9
    container_name: chronosmesh-aws-local
    ports: ["127.0.0.1:5000:5000"]
    networks: [chronosmesh-net]

  aws-bootstrap:
    build: { context: ., dockerfile: api/Dockerfile, target: worker }
    container_name: chronosmesh-aws-bootstrap
    command: ["python", "-m", "chronosmesh.persistence.bootstrap"]
    environment: *aws-local
    depends_on: [aws-local]
    restart: "no"
    networks: [chronosmesh-net]

  # ── Application ──────────────────────────────────────────────────────────────
  chronosmesh-api:
    build: { context: ., dockerfile: api/Dockerfile, target: api }
    container_name: chronosmesh-api
    ports: ["127.0.0.1:8000:8000"]
    environment:
      <<: *aws-local
      ENVIRONMENT: local
      ENABLE_DEMO_USERS: "true"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-compose-only-secret-change-me-0123456789}
      DATA_SOURCE: ${DATA_SOURCE:-demo}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      GRAFANA_URL: http://localhost:3000
      LOG_LEVEL: info
    depends_on:
      aws-bootstrap: { condition: service_completed_successfully }
      otel-collector: { condition: service_started }
    restart: unless-stopped
    networks: [chronosmesh-net]

  chronosmesh-worker:
    build: { context: ., dockerfile: api/Dockerfile, target: worker }
    container_name: chronosmesh-worker
    environment:
      <<: *aws-local
      LOG_LEVEL: info
    depends_on:
      aws-bootstrap: { condition: service_completed_successfully }
    restart: unless-stopped
    networks: [chronosmesh-net]

  # ── Observability ────────────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.98.0
    container_name: chronosmesh-otel
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    networks: [chronosmesh-net]

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: chronosmesh-prometheus
    restart: unless-stopped
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    networks: [chronosmesh-net]

  grafana:
    image: grafana/grafana:10.4.2
    container_name: chronosmesh-grafana
    restart: unless-stopped
    depends_on: [prometheus]
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      PROMETHEUS_URL: http://prometheus:9090
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [chronosmesh-net]

  # ── Optional streaming / graph stack (profile: full) ─────────────────────────
  zookeeper:
    profiles: [full]
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: chronosmesh-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [chronosmesh-net]

  kafka:
    profiles: [full]
    image: confluentinc/cp-kafka:7.5.0
    container_name: chronosmesh-kafka
    depends_on: [zookeeper]
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks: [chronosmesh-net]

  neo4j:
    profiles: [full]
    image: neo4j:5.15.0
    container_name: chronosmesh-neo4j
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-chronosmesh-local-dev}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes: [neo4j-data:/data]
    networks: [chronosmesh-net]

  flink-jobmanager:
    profiles: [full]
    image: flink:1.18.0
    container_name: chronosmesh-flink-jobmanager
    ports: ["127.0.0.1:8081:8081"]
    command: jobmanager
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"
    networks: [chronosmesh-net]

  flink-taskmanager:
    profiles: [full]
    image: flink:1.18.0
    container_name: chronosmesh-flink-taskmanager
    depends_on: [flink-jobmanager]
    command: taskmanager
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager\ntaskmanager.numberOfTaskSlots: 4"
    networks: [chronosmesh-net]

networks:
  chronosmesh-net:
    driver: bridge

volumes:
  neo4j-data:
  prometheus-data:
  grafana-data:
