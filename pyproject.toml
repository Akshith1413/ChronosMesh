[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronosmesh"
version = "0.1.0"
description = "Distributed Causality Reconstruction and Temporal Anomaly Detection for Multi-Cloud Microservices"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Akshith", email = "akshith@chronosmesh.dev"},
]
keywords = [
    "distributed-systems",
    "causality",
    "vector-clocks",
    "lamport-clocks",
    "dag",
    "microservices",
    "observability",
    "temporal-ordering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "networkx>=3.1",
    "confluent-kafka>=2.3.0",
    "protobuf>=4.25.0",
    "pydantic>=2.5.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
]
viz = [
    "matplotlib>=3.8.0",
    "graphviz>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/chronosmesh/chronosmesh"
Documentation = "https://chronosmesh.readthedocs.io"
Repository = "https://github.com/chronosmesh/chronosmesh"

[tool.setuptools.packages.find]
include = ["chronosmesh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "correctness: marks tests as correctness validation tests",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
