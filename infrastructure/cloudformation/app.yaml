AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ChronosMesh application plane: ECS Fargate (API, SQS worker, Grafana), an Application Load Balancer that only
  serves CloudFront, a CloudFront + S3 front end, least-privilege IAM per workload, CloudWatch alarms and
  dashboard, and an EventBridge rule for unexpected task stops. Data lives in the separate data stack.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedPattern: "^[a-z0-9-]{2,12}$"
  DataStackName:
    Type: String
    Default: chronosmesh-prod-data
    Description: Name of the data stack (its exports are imported here).
  OriginVerifySecretArn:
    Type: String
    Description: ARN of the origin-verify secret (output of the data stack).
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two public subnets in different Availability Zones (tasks get public IPs; no NAT gateway).
  CloudFrontPrefixListId:
    Type: String
    Description: Managed prefix list com.amazonaws.global.cloudfront.origin-facing for this region.
  ApiImage:
    Type: String
  WorkerImage:
    Type: String
  GrafanaImage:
    Type: String
  ApiDesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
  ApiMaxCount:
    Type: Number
    Default: 3
    MinValue: 1
  WorkerDesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 1
    Description: Keep at 1 (one consumer per stream); shard with SQS FIFO message groups before scaling out.
  GrafanaDesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
  MaxExperimentEvents:
    Type: Number
    Default: 20000
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]

Resources:
  # ── Security groups ───────────────────────────────────────────────────────────
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB - accepts HTTP only from CloudFront origin-facing addresses
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, SourcePrefixListId: !Ref CloudFrontPrefixListId, Description: CloudFront }
      Tags:
        - { Key: Name, Value: !Sub "chronosmesh-${Environment}-alb" }
        - { Key: Project, Value: ChronosMesh }

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Fargate tasks - reachable only from the ALB
      VpcId: !Ref VpcId
      Tags:
        - { Key: Name, Value: !Sub "chronosmesh-${Environment}-tasks" }
        - { Key: Project, Value: ChronosMesh }

  TaskIngressApi:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: ALB to API

  TaskIngressGrafana:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: ALB to Grafana

  # ── Logs ──────────────────────────────────────────────────────────────────────
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /chronosmesh/${Environment}/api
      RetentionInDays: !Ref LogRetentionDays

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /chronosmesh/${Environment}/worker
      RetentionInDays: !Ref LogRetentionDays

  GrafanaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /chronosmesh/${Environment}/grafana
      RetentionInDays: !Ref LogRetentionDays

  OtelLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /chronosmesh/${Environment}/otel
      RetentionInDays: !Ref LogRetentionDays

  # ── IAM (one role per workload, scoped to named resources) ────────────────────
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub chronosmesh-${Environment}-task-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: "sts:AssumeRole" }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-task-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !ImportValue { "Fn::Sub": "${DataStackName}-JwtSecretArn" }
                  - !ImportValue { "Fn::Sub": "${DataStackName}-MetricsTokenSecretArn" }
                  - !ImportValue { "Fn::Sub": "${DataStackName}-AdminSecretArn" }
                  - !ImportValue { "Fn::Sub": "${DataStackName}-AnalystSecretArn" }
                  - !ImportValue { "Fn::Sub": "${DataStackName}-ViewerSecretArn" }
                  - !ImportValue { "Fn::Sub": "${DataStackName}-GrafanaSecretArn" }

  ApiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub chronosmesh-${Environment}-api-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: "sts:AssumeRole" }
      Policies:
        - PolicyName: chronosmesh-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Tables
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query,
                         dynamodb:Scan, dynamodb:BatchGetItem, dynamodb:BatchWriteItem, dynamodb:DescribeTable]
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/chronosmesh-${Environment}-*
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/chronosmesh-${Environment}-*/index/*
              - Sid: ObjectsUnderExecutions
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub
                  - "${Bucket}/executions/*"
                  - { Bucket: !ImportValue { "Fn::Sub": "${DataStackName}-DataBucketArn" } }
              - Sid: ListBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !ImportValue { "Fn::Sub": "${DataStackName}-DataBucketArn" }
              - Sid: PublishEvents
                Effect: Allow
                Action: [sqs:SendMessage, sqs:GetQueueAttributes, sqs:GetQueueUrl]
                Resource: !ImportValue { "Fn::Sub": "${DataStackName}-EventsQueueArn" }
              - Sid: ReadQueueAge
                Effect: Allow
                Action: cloudwatch:GetMetricStatistics
                Resource: "*"
              - Sid: Traces
                Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords, xray:GetSamplingRules, xray:GetSamplingTargets]
                Resource: "*"

  WorkerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub chronosmesh-${Environment}-worker-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: "sts:AssumeRole" }
      Policies:
        - PolicyName: chronosmesh-worker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Tables
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:BatchWriteItem,
                         dynamodb:DeleteItem, dynamodb:DescribeTable]
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/chronosmesh-${Environment}-*
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/chronosmesh-${Environment}-*/index/*
              - Sid: ObjectsUnderExecutions
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub
                  - "${Bucket}/executions/*"
                  - { Bucket: !ImportValue { "Fn::Sub": "${DataStackName}-DataBucketArn" } }
              - Sid: ListBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !ImportValue { "Fn::Sub": "${DataStackName}-DataBucketArn" }
              - Sid: ConsumeEvents
                Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility, sqs:GetQueueAttributes, sqs:GetQueueUrl]
                Resource: !ImportValue { "Fn::Sub": "${DataStackName}-EventsQueueArn" }
              - Sid: Metrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition: { StringEquals: { "cloudwatch:namespace": ChronosMesh } }

  GrafanaTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub chronosmesh-${Environment}-grafana-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: "sts:AssumeRole" }
      Policies:
        - PolicyName: grafana-cloudwatch-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [cloudwatch:DescribeAlarmsForMetric, cloudwatch:DescribeAlarmHistory, cloudwatch:DescribeAlarms,
                         cloudwatch:ListMetrics, cloudwatch:GetMetricStatistics, cloudwatch:GetMetricData,
                         logs:DescribeLogGroups, logs:GetLogGroupFields, logs:StartQuery, logs:StopQuery,
                         logs:GetQueryResults, logs:GetLogEvents, ec2:DescribeTags, ec2:DescribeInstances,
                         ec2:DescribeRegions, tag:GetResources]
                Resource: "*"

  # ── ECS cluster ───────────────────────────────────────────────────────────────
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub chronosmesh-${Environment}
      Tags: [{ Key: Project, Value: ChronosMesh }]

  # ── Load balancer (serves CloudFront only) ────────────────────────────────────
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub chronosmesh-${Environment}
      Scheme: internet-facing
      Type: application
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: "120" }
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
        - { Key: routing.http.desync_mitigation_mode, Value: strictest }
      Tags: [{ Key: Project, Value: ChronosMesh }]

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub chronosmesh-${Environment}-api
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8000
      TargetType: ip
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }
        # The Trace Explorer keeps per-user state in the replica's memory; keep a browser on one replica.
        - { Key: stickiness.enabled, Value: "true" }
        - { Key: stickiness.type, Value: lb_cookie }
        - { Key: stickiness.lb_cookie.duration_seconds, Value: "86400" }

  GrafanaTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub chronosmesh-${Environment}-grafana
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 3000
      TargetType: ip
      HealthCheckPath: /grafana/api/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: { StatusCode: "403", ContentType: text/plain, MessageBody: forbidden }

  GrafanaRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 10
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Verify
            Values: [!Sub "{{resolve:secretsmanager:${OriginVerifySecretArn}:SecretString:token}}"]
        - { Field: path-pattern, PathPatternConfig: { Values: ["/grafana", "/grafana/*"] } }
      Actions:
        - { Type: forward, TargetGroupArn: !Ref GrafanaTargetGroup }

  # An ALB rule allows at most 5 condition values in total (the header counts as one), so the API paths are split
  # across rules; tests/unit/test_observability_configs.py enforces the limit.
  ApiRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 20
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Verify
            Values: [!Sub "{{resolve:secretsmanager:${OriginVerifySecretArn}:SecretString:token}}"]
        - { Field: path-pattern, PathPatternConfig: { Values: ["/api/*", "/auth/*", "/graphql", "/graphql/*"] } }
      Actions:
        - { Type: forward, TargetGroupArn: !Ref ApiTargetGroup }

  ApiDocsRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 21
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Verify
            Values: [!Sub "{{resolve:secretsmanager:${OriginVerifySecretArn}:SecretString:token}}"]
        - { Field: path-pattern, PathPatternConfig: { Values: ["/docs", "/docs/*", "/redoc", "/redoc/*"] } }
      Actions:
        - { Type: forward, TargetGroupArn: !Ref ApiTargetGroup }

  ApiSpecRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 22
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Verify
            Values: [!Sub "{{resolve:secretsmanager:${OriginVerifySecretArn}:SecretString:token}}"]
        - { Field: path-pattern, PathPatternConfig: { Values: ["/openapi.json"] } }
      Actions:
        - { Type: forward, TargetGroupArn: !Ref ApiTargetGroup }

  # ── Task definitions ──────────────────────────────────────────────────────────
  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub chronosmesh-${Environment}-api
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "2048"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ApiTaskRole.Arn
      Volumes: [{ Name: tmp }]
      ContainerDefinitions:
        - Name: api
          Image: !Ref ApiImage
          Essential: true
          ReadonlyRootFilesystem: true
          MountPoints: [{ SourceVolume: tmp, ContainerPath: /tmp }]
          PortMappings: [{ ContainerPort: 8000, Protocol: tcp }]
          Environment:
            - { Name: ENVIRONMENT, Value: production }
            - { Name: LOG_LEVEL, Value: info }
            - { Name: AWS_REGION, Value: !Ref "AWS::Region" }
            - { Name: STORAGE_BACKEND, Value: aws }
            - { Name: DYNAMODB_EXEC_TABLE, Value: !ImportValue { "Fn::Sub": "${DataStackName}-ExecutionsTable" } }
            - { Name: DYNAMODB_EVENTS_TABLE, Value: !ImportValue { "Fn::Sub": "${DataStackName}-EventsTable" } }
            - { Name: DYNAMODB_ANOMALY_TABLE, Value: !ImportValue { "Fn::Sub": "${DataStackName}-AnomaliesTable" } }
            - { Name: DYNAMODB_GRAPH_TABLE, Value: !ImportValue { "Fn::Sub": "${DataStackName}-GraphsTable" } }
            - { Name: S3_DATA_BUCKET, Value: !ImportValue { "Fn::Sub": "${DataStackName}-DataBucket" } }
            - { Name: SQS_EVENTS_QUEUE_URL, Value: !ImportValue { "Fn::Sub": "${DataStackName}-EventsQueueUrl" } }
            - { Name: INGEST_MODE, Value: queue }
            - { Name: MAX_EXPERIMENT_EVENTS, Value: !Ref MaxExperimentEvents }
            - { Name: ENABLE_DEMO_USERS, Value: "false" }
            - { Name: AUTH_USERS, Value: "admin:admin,analyst:analyst,viewer:viewer" }
            - { Name: ACCESS_TOKEN_EXPIRE_MINUTES, Value: "60" }
            - { Name: OTEL_EXPORTER_OTLP_ENDPOINT, Value: "http://localhost:4318" }
            - { Name: OTEL_SERVICE_NAME, Value: chronosmesh-api }
            - { Name: GRAFANA_URL, Value: !Sub "https://${Distribution.DomainName}/grafana/" }
            - { Name: CLOUDWATCH_DASHBOARD_URL, Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=chronosmesh-${Environment}" }
            - { Name: XRAY_URL, Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/xray/home?region=${AWS::Region}#/service-map" }
          Secrets:
            - { Name: JWT_SECRET_KEY, ValueFrom: !ImportValue { "Fn::Sub": "${DataStackName}-JwtSecretArn" } }
            - { Name: METRICS_TOKEN, ValueFrom: !ImportValue { "Fn::Sub": "${DataStackName}-MetricsTokenSecretArn" } }
            - { Name: AUTH_PASSWORD_ADMIN, ValueFrom: !Sub ["${Arn}:password::", { Arn: !ImportValue { "Fn::Sub": "${DataStackName}-AdminSecretArn" } }] }
            - { Name: AUTH_PASSWORD_ANALYST, ValueFrom: !Sub ["${Arn}:password::", { Arn: !ImportValue { "Fn::Sub": "${DataStackName}-AnalystSecretArn" } }] }
            - { Name: AUTH_PASSWORD_VIEWER, ValueFrom: !Sub ["${Arn}:password::", { Arn: !ImportValue { "Fn::Sub": "${DataStackName}-ViewerSecretArn" } }] }
          HealthCheck:
            Command: [CMD-SHELL, "curl -fsS http://localhost:8000/api/health || exit 1"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref ApiLogGroup, awslogs-region: !Ref "AWS::Region", awslogs-stream-prefix: api }
        - Name: otel
          Image: public.ecr.aws/aws-observability/aws-otel-collector:v0.40.0
          Essential: false
          Cpu: 64
          MemoryReservation: 128
          Environment:
            - Name: AOT_CONFIG_CONTENT
              Value: |
                receivers:
                  otlp:
                    protocols:
                      http:
                        endpoint: 127.0.0.1:4318
                processors:
                  batch:
                    timeout: 5s
                exporters:
                  awsxray:
                service:
                  pipelines:
                    traces:
                      receivers: [otlp]
                      processors: [batch]
                      exporters: [awsxray]
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref OtelLogGroup, awslogs-region: !Ref "AWS::Region", awslogs-stream-prefix: otel }

  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub chronosmesh-${Environment}-worker
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt WorkerTaskRole.Arn
      Volumes: [{ Name: tmp }]
      ContainerDefinitions:
        - Name: worker
          Image: !Ref WorkerImage
          Essential: true
          ReadonlyRootFilesystem: true
          StopTimeout: 40
          MountPoints: [{ SourceVolume: tmp, ContainerPath: /tmp }]
          Environment:
            - { Name: ENVIRONMENT, Value: production }
            - { Name: LOG_LEVEL, Value: INFO }
            - { Name: AWS_REGION, Value: !Ref "AWS::Region" }
            - { Name: STORAGE_BACKEND, Value: aws }
            - { Name: DYNAMODB_EXEC_TABLE, Value: !ImportValue { "Fn::Sub": "${DataStackName}-ExecutionsTable" } }
            - { Name: DYNAMODB_EVENTS_TABLE, Value: !ImportValue { "Fn::Sub": "${DataStackName}-EventsTable" } }
            - { Name: DYNAMODB_ANOMALY_TABLE, Value: !ImportValue { "Fn::Sub": "${DataStackName}-AnomaliesTable" } }
            - { Name: DYNAMODB_GRAPH_TABLE, Value: !ImportValue { "Fn::Sub": "${DataStackName}-GraphsTable" } }
            - { Name: S3_DATA_BUCKET, Value: !ImportValue { "Fn::Sub": "${DataStackName}-DataBucket" } }
            - { Name: SQS_EVENTS_QUEUE_URL, Value: !ImportValue { "Fn::Sub": "${DataStackName}-EventsQueueUrl" } }
            - { Name: CLOUDWATCH_METRICS, Value: "true" }
            - { Name: WORKER_METRICS_PORT, Value: "9100" }
          HealthCheck:
            Command: [CMD-SHELL, "curl -fsS http://localhost:9100/metrics > /dev/null || exit 1"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref WorkerLogGroup, awslogs-region: !Ref "AWS::Region", awslogs-stream-prefix: worker }

  GrafanaTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub chronosmesh-${Environment}-grafana
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt GrafanaTaskRole.Arn
      ContainerDefinitions:
        - Name: grafana
          Image: !Ref GrafanaImage
          Essential: true
          PortMappings: [{ ContainerPort: 3000, Protocol: tcp }]
          Environment:
            - { Name: GF_SERVER_ROOT_URL, Value: !Sub "https://${Distribution.DomainName}/grafana/" }
            - { Name: GF_SERVER_SERVE_FROM_SUB_PATH, Value: "true" }
            - { Name: GF_SECURITY_ADMIN_USER, Value: admin }
            - { Name: GF_SECURITY_ALLOW_EMBEDDING, Value: "true" }
            - { Name: GF_SECURITY_COOKIE_SECURE, Value: "true" }
            - { Name: AWS_REGION, Value: !Ref "AWS::Region" }
          Secrets:
            - { Name: GF_SECURITY_ADMIN_PASSWORD, ValueFrom: !Sub ["${Arn}:password::", { Arn: !ImportValue { "Fn::Sub": "${DataStackName}-GrafanaSecretArn" } }] }
          HealthCheck:
            Command: [CMD-SHELL, "wget -q --spider http://localhost:3000/grafana/api/health || exit 1"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 40
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref GrafanaLogGroup, awslogs-region: !Ref "AWS::Region", awslogs-stream-prefix: grafana }

  # ── Services ──────────────────────────────────────────────────────────────────
  ApiService:
    Type: AWS::ECS::Service
    DependsOn: [ApiRule, ApiDocsRule, ApiSpecRule]
    Properties:
      ServiceName: !Sub chronosmesh-${Environment}-api
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: !Ref ApiDesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      HealthCheckGracePeriodSeconds: 90
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref TaskSecurityGroup]
          Subnets: !Ref SubnetIds
      LoadBalancers:
        - { ContainerName: api, ContainerPort: 8000, TargetGroupArn: !Ref ApiTargetGroup }
      Tags: [{ Key: Project, Value: ChronosMesh }]

  WorkerService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub chronosmesh-${Environment}-worker
      Cluster: !Ref Cluster
      TaskDefinition: !Ref WorkerTaskDefinition
      DesiredCount: !Ref WorkerDesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DeploymentConfiguration:
        MinimumHealthyPercent: 0        # stop the old consumer before starting the new one (single consumer)
        MaximumPercent: 100
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref TaskSecurityGroup]
          Subnets: !Ref SubnetIds
      Tags: [{ Key: Project, Value: ChronosMesh }]

  GrafanaService:
    Type: AWS::ECS::Service
    DependsOn: [GrafanaRule]
    Properties:
      ServiceName: !Sub chronosmesh-${Environment}-grafana
      Cluster: !Ref Cluster
      TaskDefinition: !Ref GrafanaTaskDefinition
      DesiredCount: !Ref GrafanaDesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      HealthCheckGracePeriodSeconds: 90
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref TaskSecurityGroup]
          Subnets: !Ref SubnetIds
      LoadBalancers:
        - { ContainerName: grafana, ContainerPort: 3000, TargetGroupArn: !Ref GrafanaTargetGroup }
      Tags: [{ Key: Project, Value: ChronosMesh }]

  ApiScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub service/${Cluster}/${ApiService.Name}
      MinCapacity: 1
      MaxCapacity: !Ref ApiMaxCount

  ApiScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub chronosmesh-${Environment}-api-cpu
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ApiScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        ScaleInCooldown: 300
        ScaleOutCooldown: 60
        PredefinedMetricSpecification: { PredefinedMetricType: ECSServiceAverageCPUUtilization }

  # ── Front end: S3 + CloudFront (OAC) ──────────────────────────────────────────
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub chronosmesh-${Environment}-frontend-${AWS::AccountId}
      VersioningConfiguration: { Status: Enabled }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
            BucketKeyEnabled: true
      LifecycleConfiguration:
        Rules:
          - { Id: expire-old-versions, Status: Enabled, NoncurrentVersionExpiration: { NoncurrentDays: 14 } }
      Tags: [{ Key: Project, Value: ChronosMesh }]

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals: { "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}" }
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt FrontendBucket.Arn, !Sub "${FrontendBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub chronosmesh-${Environment}-frontend
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub ChronosMesh ${Environment} - React dashboard (S3) + API/Grafana (ALB)
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        DefaultRootObject: index.html
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: alb
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Sub "{{resolve:secretsmanager:${OriginVerifySecretArn}:SecretString:token}}"
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # Managed-SecurityHeadersPolicy
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: alb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # Managed-SecurityHeadersPolicy (HSTS etc.)  # Managed-AllViewerExceptHostHeader
            Compress: true
          - PathPattern: /auth/*
            TargetOriginId: alb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # Managed-SecurityHeadersPolicy (HSTS etc.)
          - PathPattern: /graphql*
            TargetOriginId: alb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # Managed-SecurityHeadersPolicy (HSTS etc.)
          - PathPattern: /grafana/*
            TargetOriginId: alb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # Managed-SecurityHeadersPolicy (HSTS etc.)
            Compress: true
          - PathPattern: /docs*
            TargetOriginId: alb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # Managed-SecurityHeadersPolicy (HSTS etc.)
          - PathPattern: /redoc*
            TargetOriginId: alb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # Managed-SecurityHeadersPolicy (HSTS etc.)
          - PathPattern: /openapi.json
            TargetOriginId: alb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # Managed-SecurityHeadersPolicy (HSTS etc.)
      Tags: [{ Key: Project, Value: ChronosMesh }]

  # ── Alarms ────────────────────────────────────────────────────────────────────
  ApiUnhealthyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub chronosmesh-${Environment}-api-unhealthy-targets
      AlarmDescription: The API has no healthy target behind the load balancer.
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - { Name: TargetGroup, Value: !GetAtt ApiTargetGroup.TargetGroupFullName }
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!ImportValue { "Fn::Sub": "${DataStackName}-AlertsTopicArn" }]
      OKActions: [!ImportValue { "Fn::Sub": "${DataStackName}-AlertsTopicArn" }]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub chronosmesh-${Environment}-api-5xx
      AlarmDescription: The API returned 10 or more 5xx responses in 5 minutes.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!ImportValue { "Fn::Sub": "${DataStackName}-AlertsTopicArn" }]

  ApiCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub chronosmesh-${Environment}-api-cpu-high
      AlarmDescription: API CPU above 85% for 15 minutes (autoscaling is at its ceiling or too slow).
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - { Name: ClusterName, Value: !Ref Cluster }
        - { Name: ServiceName, Value: !GetAtt ApiService.Name }
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!ImportValue { "Fn::Sub": "${DataStackName}-AlertsTopicArn" }]

  WorkerHeartbeatAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub chronosmesh-${Environment}-worker-down
      AlarmDescription: No worker heartbeat for 3 minutes - queued events are not being reconstructed.
      Namespace: ChronosMesh
      MetricName: WorkerHeartbeat
      Dimensions: [{ Name: Service, Value: worker }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!ImportValue { "Fn::Sub": "${DataStackName}-AlertsTopicArn" }]
      OKActions: [!ImportValue { "Fn::Sub": "${DataStackName}-AlertsTopicArn" }]

  QueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub chronosmesh-${Environment}-queue-backlog-age
      AlarmDescription: The oldest queued event is more than 5 minutes old.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions: [{ Name: QueueName, Value: !ImportValue { "Fn::Sub": "${DataStackName}-EventsQueueName" } }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 300
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!ImportValue { "Fn::Sub": "${DataStackName}-AlertsTopicArn" }]

  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub chronosmesh-${Environment}-dead-letter-queue-not-empty
      AlarmDescription: A message exhausted its retries and was moved to the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !ImportValue { "Fn::Sub": "${DataStackName}-EventsDlqName" } }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!ImportValue { "Fn::Sub": "${DataStackName}-AlertsTopicArn" }]

  ProcessingErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub chronosmesh-${Environment}-processing-errors
      AlarmDescription: More than 5 worker processing errors in 5 minutes.
      Namespace: ChronosMesh
      MetricName: ProcessingErrors
      Dimensions: [{ Name: Service, Value: worker }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!ImportValue { "Fn::Sub": "${DataStackName}-AlertsTopicArn" }]

  UnresolvedDependenciesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub chronosmesh-${Environment}-unresolved-dependencies
      AlarmDescription: Over 500 causal dependencies have stayed unresolved for 10 minutes (lost events / stalled producer).
      Namespace: ChronosMesh
      MetricName: UnresolvedDependencies
      Dimensions: [{ Name: Service, Value: worker }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 500
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!ImportValue { "Fn::Sub": "${DataStackName}-AlertsTopicArn" }]

  # ── EventBridge: unexpected task stops -> SNS ─────────────────────────────────
  TaskStoppedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub chronosmesh-${Environment}-task-stopped
      Description: Notify when an ECS task stops for a reason other than a normal deployment or scale-in.
      EventPattern:
        source: [aws.ecs]
        detail-type: [ECS Task State Change]
        detail:
          clusterArn: [!GetAtt Cluster.Arn]
          lastStatus: [STOPPED]
          stopCode: [TaskFailedToStart, EssentialContainerExited]
      Targets:
        - Id: alerts
          Arn: !ImportValue { "Fn::Sub": "${DataStackName}-AlertsTopicArn" }
          InputTransformer:
            InputPathsMap: { group: $.detail.group, reason: $.detail.stoppedReason, code: $.detail.stopCode }
            InputTemplate: '"ChronosMesh ECS task stopped: <group> | <code> | <reason>"'

  # ── Dashboard ─────────────────────────────────────────────────────────────────
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub chronosmesh-${Environment}
      DashboardBody: !Sub
        - |
          {"widgets":[
            {"type":"text","x":0,"y":0,"width":24,"height":2,"properties":{"markdown":"# ChronosMesh ${Environment}\nPipeline health: API -> SQS -> worker -> DynamoDB/S3. Alarms notify the alerts SNS topic."}},
            {"type":"metric","x":0,"y":2,"width":8,"height":6,"properties":{"title":"Queue backlog age (s)","region":"${AWS::Region}","stat":"Maximum","period":60,"metrics":[["AWS/SQS","ApproximateAgeOfOldestMessage","QueueName","${QueueName}"]]}},
            {"type":"metric","x":8,"y":2,"width":8,"height":6,"properties":{"title":"Queue depth / DLQ","region":"${AWS::Region}","stat":"Maximum","period":60,"metrics":[["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${QueueName}"],["...","${DlqName}"]]}},
            {"type":"metric","x":16,"y":2,"width":8,"height":6,"properties":{"title":"Worker heartbeat","region":"${AWS::Region}","stat":"Sum","period":60,"metrics":[["ChronosMesh","WorkerHeartbeat","Service","worker"]]}},
            {"type":"metric","x":0,"y":8,"width":12,"height":6,"properties":{"title":"Events processed / duplicates / errors","region":"${AWS::Region}","stat":"Sum","period":60,"metrics":[["ChronosMesh","EventsProcessed","Service","worker"],[".","DuplicateEvents",".","."],[".","ProcessingErrors",".","."]]}},
            {"type":"metric","x":12,"y":8,"width":12,"height":6,"properties":{"title":"Unresolved causal dependencies","region":"${AWS::Region}","stat":"Maximum","period":60,"metrics":[["ChronosMesh","UnresolvedDependencies","Service","worker"]]}},
            {"type":"metric","x":0,"y":14,"width":12,"height":6,"properties":{"title":"API requests and latency","region":"${AWS::Region}","period":60,"metrics":[["AWS/ApplicationELB","RequestCount","LoadBalancer","${LbName}",{"stat":"Sum"}],[".","TargetResponseTime",".",".",{"stat":"p95","yAxis":"right"}]]}},
            {"type":"metric","x":12,"y":14,"width":12,"height":6,"properties":{"title":"ECS CPU / memory (API)","region":"${AWS::Region}","stat":"Average","period":60,"metrics":[["AWS/ECS","CPUUtilization","ClusterName","${ClusterName}","ServiceName","${ApiServiceName}"],[".","MemoryUtilization",".",".",".","."]]}}
          ]}
        - QueueName: !ImportValue { "Fn::Sub": "${DataStackName}-EventsQueueName" }
          DlqName: !ImportValue { "Fn::Sub": "${DataStackName}-EventsDlqName" }
          LbName: !GetAtt LoadBalancer.LoadBalancerFullName
          ClusterName: !Ref Cluster
          ApiServiceName: !GetAtt ApiService.Name

Outputs:
  SiteUrl:
    Description: Public HTTPS URL of the dashboard (React app, API and Grafana)
    Value: !Sub "https://${Distribution.DomainName}"
  GrafanaUrl:
    Value: !Sub "https://${Distribution.DomainName}/grafana/"
  DistributionId:
    Value: !Ref Distribution
  FrontendBucketName:
    Value: !Ref FrontendBucket
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  ClusterName:
    Value: !Ref Cluster
  ApiServiceName:
    Value: !GetAtt ApiService.Name
  WorkerServiceName:
    Value: !GetAtt WorkerService.Name
  GrafanaServiceName:
    Value: !GetAtt GrafanaService.Name
  DashboardUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=chronosmesh-${Environment}"
