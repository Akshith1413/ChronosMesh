services:
  # ── ChronosMesh API (Guru's FastAPI backend) ─────────────────────────────────
  chronosmesh-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: chronosmesh-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=info
    volumes:
      - .:/app
    working_dir: /app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - chronosmesh-net

  # ── Optional: Nginx to serve frontend + proxy API ───────────────────────────
  # Uncomment when deploying to a server
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./frontend:/usr/share/nginx/html/frontend
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf
  #   depends_on:
  #     - chronosmesh-api
  #   networks:
  #     - chronosmesh-net

networks:
  chronosmesh-net:
    driver: bridge
